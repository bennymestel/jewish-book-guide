services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: books
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./db/books.dump:/docker-entrypoint-initdb.d/books.dump
      - ./db/restore.sh:/docker-entrypoint-initdb.d/restore.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d books"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp:
    build: .
    command: python mcp_server/server.py
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres@db/books
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres@db/books
      LOG_LEVEL: INFO
      BOOKS_MCP_URL: http://mcp:8001/mcp
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  hf_cache:

