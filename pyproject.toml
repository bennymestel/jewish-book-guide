[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jewish-book-guide"
version = "0.1.0"
description = "Jewish book recommendation system backed by Sefaria metadata"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "torch<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>2.2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<=4.44.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>4.44.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "typer>=0.12",
    "rich>=13.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.2",
    # Must stay <2: SDK v2.0.0 (2026-07-28) removed the `mcp.server.fastmcp` module
    # path, which mcp_server/server.py AND langchain-mcp-adapters both import — so
    # v2 breaks the agent, not just the server. Revisit when langchain-mcp-adapters
    # ships SDK v2 support.
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
jewish-book-guide = "cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent", "recommender", "ingestion"]
include = ["cli.py", "config.py", "db.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
