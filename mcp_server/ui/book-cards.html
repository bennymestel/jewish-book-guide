<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Book Cards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4ead9;
    --surface: #fffdf9;
    --surface2: #f1e4cd;
    --border: #ddc79b;
    --border-light: #c3ac7c;
    --text: #3a2418;
    --text-muted: #7a6248;
    --text-dim: #a9926f;
    --accent: #2456d6;
    --accent-deep: #1b3f9e;
    --accent-glow: rgba(43, 127, 248, 0.16);
    --gold: #b3862c;
    --gold-soft: rgba(179, 134, 44, 0.22);
    --radius: 16px;
    --radius-sm: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-serif: Georgia, "Times New Roman", serif;
  }

  html, body { background: var(--bg); font-family: var(--font); color: var(--text); }
  body { padding: 14px; }

  #root {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .empty {
    color: var(--text-muted);
    font-size: 14px;
    padding: 8px 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .card-head h3 {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--accent-deep);
  }

  .score {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-deep);
    background: var(--accent-glow);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .author {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    padding: 2px 9px;
    border: 1px solid var(--border-light);
    background: var(--surface2);
    color: var(--text-muted);
  }

  .chip-cat { color: var(--gold); border-color: var(--gold-soft); background: var(--gold-soft); }

  .desc {
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
  }

  .themes { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag {
    font-size: 10.5px;
    color: var(--text-dim);
    background: var(--surface2);
    border-radius: 6px;
    padding: 1px 7px;
  }
</style>
</head>
<body>
<div id="root">
  <div class="empty">Loading…</div>
</div>
<script>
(function () {
  let msgId = 0;
  let initId = null;

  function post(method, params) {
    parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
  }

  function request(method, params) {
    msgId += 1;
    parent.postMessage({ jsonrpc: "2.0", method: method, id: msgId, params: params }, "*");
    return msgId;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str === undefined || str === null ? "" : String(str);
    return div.innerHTML;
  }

  function reportSize() {
    requestAnimationFrame(function () {
      post("ui/sizeChanged", { height: document.documentElement.scrollHeight });
    });
  }

  function render(payload) {
    const recs = (payload && (payload.recommendations || payload.books)) || [];
    const root = document.getElementById("root");
    root.innerHTML = "";

    if (recs.length === 0) {
      root.innerHTML = '<div class="empty">No books found.</div>';
      reportSize();
      return;
    }

    recs.forEach(function (book) {
      const card = document.createElement("div");
      card.className = "card";
      const scorePct = typeof book.score === "number" ? Math.round(book.score * 100) + "%" : "";
      const themes = Array.isArray(book.themes) ? book.themes : [];
      card.innerHTML =
        '<div class="card-head">' +
          "<h3>" + escapeHtml(book.title) + "</h3>" +
          (scorePct ? '<span class="score">' + scorePct + "</span>" : "") +
        "</div>" +
        '<div class="author">' + escapeHtml(book.author) + "</div>" +
        '<div class="chips">' +
          (book.category ? '<span class="chip chip-cat">' + escapeHtml(book.category) + "</span>" : "") +
          (book.difficulty ? '<span class="chip">Difficulty ' + escapeHtml(book.difficulty) + "/5</span>" : "") +
        "</div>" +
        (book.description ? '<p class="desc">' + escapeHtml(book.description) + "</p>" : "") +
        (themes.length
          ? '<div class="themes">' + themes.map(function (t) { return '<span class="tag">' + escapeHtml(t) + "</span>"; }).join("") + "</div>"
          : "");

      root.appendChild(card);
    });

    reportSize();
  }

  window.addEventListener("message", function (event) {
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.id === initId && msg.result) {
      render(msg.result.payload || msg.result);
    }
  });

  new ResizeObserver(reportSize).observe(document.body);

  initId = request("ui/initialize");
})();
</script>
</body>
</html>
